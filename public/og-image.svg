<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="white" fill-opacity="0.05"/>
  <circle cx="1100" cy="530" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="600" cy="315" r="300" fill="white" fill-opacity="0.03"/>
  
  <!-- Main content card -->
  <rect x="100" y="80" width="1000" height="470" rx="24" fill="white" fill-opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Logo/Icon area -->
  <circle cx="220" cy="180" r="60" fill="url(#accentGradient)"/>
  <text x="220" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">F</text>
  
  <!-- Brand name -->
  <text x="300" y="165" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1f2937">FitJourney</text>
  <text x="300" y="205" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#10b981">USA</text>
  
  <!-- Main headline -->
  <text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#1f2937">Free Calorie Calculator</text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#059669">Lose Weight & Track Nutrition</text>
  
  <!-- Subheadline -->
  <text x="600" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6b7280">Trusted by 50,000+ Americans • TDEE • Macros • Meal Plans</text>
  
  <!-- CTA Button -->
  <rect x="450" y="480" width="300" height="50" rx="25" fill="url(#accentGradient)"/>
  <text x="600" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white">Start Calculating Free →</text>
  
  <!-- Trust badges -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">★★★★★ 4.8/5 Rating • 100% Free • No Sign-up Required</text>
</svg>
